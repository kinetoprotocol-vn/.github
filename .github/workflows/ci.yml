name: Axioledger Monorepo CI Pipeline

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # 1. RUST CORE MATRIX: L1 Settlement, Consensus Engine, & SVM Runtime
  # ---------------------------------------------------------------------------
  rust-ci:
    name: Rust Core / L1 Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm libssl-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust Workspace Tests
        run: cargo test --workspace --exclude zk-prover-gpu

  # ---------------------------------------------------------------------------
  # 2. NODE.JS / PNPM MATRIX: SDKs, ANS Resolver, & Subgraph Data
  # ---------------------------------------------------------------------------
  node-ci:
    name: Node.js / TypeScript SDKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck TypeScript Codebases
        run: pnpm --recursive run typecheck || true

      - name: Run JavaScript/TypeScript Unit Tests
        run: pnpm test

  # ---------------------------------------------------------------------------
  # 3. VYPER & MOCCASIN MATRIX: Smart Contracts & Invariant Fuzzing
  # ---------------------------------------------------------------------------
  vyper-moccasin-ci:
    name: Vyper & Moccasin Smart Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./05-kinetoprotocol-dex/clamm-core
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python Environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Moccasin & Vyper Toolchain
        run: |
          python -m pip install --upgrade pip
          pip install moccasin vyper pytest

      - name: Compile Vyper Smart Contracts
        run: moccasin compile

      - name: Run Moccasin / Pytest Test Suite
        run: moccasin test

  # ---------------------------------------------------------------------------
  # 4. STATIC SECURITY ANALYSIS: Aderyn & License Compliance
  # ---------------------------------------------------------------------------
  security-audit:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Aderyn Analyzer
        run: cargo install aderyn || true

      - name: Run Aderyn Static Analyzer
        run: |
          aderyn . --output report.md || true

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: aderyn-security-report
          path: report.md
